name: Build and deploy English Encyclopedia

# Build and deploy pushes to main; retain the manual deployment option.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.ref != 'refs/heads/feature/quartz-wiki'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6
      - run: npm ci
      - name: Prepare Quartz 5 plugins
        run: npx quartz plugin install --from-config
      - run: npx playwright install --with-deps chromium
      - name: Validate publication, types, rendering, search and both URL layouts
        run: npm test
      - name: Set production base URL from GitHub Pages
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs'
          const url = new URL(process.env.PAGES_URL)
          fs.appendFileSync(process.env.GITHUB_ENV, `SITE_BASE_URL=${url.host}${url.pathname.replace(/\/$/, '')}\n`)
          JS
      - name: Build selected public content
        run: npm run build
      - name: Verify production artifact
        run: npm run test:output
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/public
  deploy:
    needs: build
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.ref != 'refs/heads/feature/quartz-wiki'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
