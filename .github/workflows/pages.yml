name: Build and deploy English Encyclopedia

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# Serialize both code and data builds through the same shared workflow.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  sample:
    name: Verify default sample checkout
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/vault'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: website/site
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          path: website
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: website/site/package-lock.json
      - run: npm ci
      - run: npx quartz plugin install --from-config
      - run: npx playwright install --with-deps chromium
      # No VAULT_ROOT: exercise the pinned sample exactly as a new clone does.
      - run: npm run lint:timestamps
      - run: npm test
  build:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/vault'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: read
    env:
      VAULT_ROOT: ${{ github.workspace }}/website/.vault-data
    defaults:
      run:
        working-directory: website/site
    steps:
      - name: Check out website code
        uses: actions/checkout@v6
        with:
          ref: main
          path: website
          fetch-depth: 0
          persist-credentials: false
      # Deploy current vault data even when main pins an older submodule commit.
      # The separate checkout supplies full history and write credentials only here.
      - name: Check out latest vault data at the submodule path
        uses: actions/checkout@v6
        with:
          ref: vault
          path: website/.vault-data
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: website/site/package-lock.json
      - run: npm ci
      - name: Validate vault, repair missing timestamps and commit to vault
        run: node scripts/repair-vault-timestamps.mjs --push
      - name: Prepare Quartz plugins
        run: npx quartz plugin install --from-config
      - run: npx playwright install --with-deps chromium
      - name: Validate publication, types, rendering, search and URL layouts
        run: npm test
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Set production base URL
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs'
          const url = new URL(process.env.PAGES_URL)
          fs.appendFileSync(process.env.GITHUB_ENV, `SITE_BASE_URL=${url.host}${url.pathname.replace(/\/$/, '')}\n`)
          JS
      - name: Build public content
        run: npm run build
      - name: Verify production artifact
        run: npm run test:output
      - uses: actions/upload-pages-artifact@v4
        with:
          path: website/site/public
  deploy:
    needs: [build, sample]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
